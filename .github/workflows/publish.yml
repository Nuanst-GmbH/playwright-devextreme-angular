name: Publish to npm

on:
  release:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major) or specific version (e.g., 1.0.1)'
        required: false
        default: 'patch'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js not found after build"
            exit 1
          fi
          if [ ! -f "dist/index.d.ts" ]; then
            echo "Error: dist/index.d.ts not found after build"
            exit 1
          fi
          echo "✓ Build verification passed"

      - name: Install sample-app dependencies
        run: |
          cd examples/sample-app
          npm install

      - name: Install Playwright browsers
        run: |
          cd examples/sample-app
          npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: npm test
        env:
          CI: true
        continue-on-error: true

      - name: Extract version from release tag (if triggered by release)
        if: github.event_name == 'release'
        id: release_version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present (e.g., "v1.0.0" -> "1.0.0")
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Bump version (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          if [ $? -ne 0 ]; then
            echo "Error: Failed to bump version to ${{ inputs.version }}"
            exit 1
          fi
          echo "✓ Version bumped successfully"

      - name: Verify version matches release tag (release trigger only)
        if: github.event_name == 'release'
        run: |
          RELEASE_VERSION="${{ steps.release_version.outputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Package version ($PACKAGE_VERSION) does not match release tag version ($RELEASE_VERSION)"
            exit 1
          fi
          echo "✓ Version verified: $PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Verifying package $PACKAGE_NAME@$PACKAGE_VERSION exists on npm..."
          
          # Wait a few seconds for npm registry to update
          sleep 5
          
          # Check if package exists on npm
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version)
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "✓ Package $PACKAGE_NAME@$PACKAGE_VERSION successfully published to npm"
            else
              echo "Error: Published version ($PUBLISHED_VERSION) does not match expected version ($PACKAGE_VERSION)"
              exit 1
            fi
          else
            echo "Error: Package $PACKAGE_NAME@$PACKAGE_VERSION not found on npm"
            exit 1
          fi

      - name: Commit version bump and create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && success() && inputs.version != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin $BRANCH
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

