name: Publish to npm

on:
  release:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major) or specific version (e.g., 1.0.1)'
        required: false
        default: 'patch'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nuanst-one'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install sample-app dependencies
        run: |
          cd examples/sample-app
          npm install

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Extract version from release tag (if triggered by release)
        if: github.event_name == 'release'
        id: release_version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present (e.g., "v1.0.0" -> "1.0.0")
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Bump version (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          if [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          else
            npm version ${{ inputs.version }} --no-git-tag-version
          fi

      - name: Verify version matches release tag (release trigger only)
        if: github.event_name == 'release'
        run: |
          RELEASE_VERSION="${{ steps.release_version.outputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Package version ($PACKAGE_VERSION) does not match release tag version ($RELEASE_VERSION)"
            exit 1
          fi
          echo "✓ Version verified: $PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --access public

      - name: Commit version bump and create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && success() && inputs.version != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin $BRANCH
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

