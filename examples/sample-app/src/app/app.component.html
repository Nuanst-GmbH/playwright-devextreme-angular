<div class="container">
  <h1>{{ title }}</h1>
  
  <!-- Button Section -->
  <section id="button-section" class="section">
    <h2>Button Component</h2>
    <div class="demo-group">
      <dx-button
        id="my-button"
        [text]="buttonText"
        [disabled]="buttonDisabled"
        (onClick)="onButtonClick()"
        type="default">
      </dx-button>
      <dx-button
        id="toggle-button"
        text="Toggle Disabled"
        (onClick)="toggleButtonDisabled()"
        type="normal">
      </dx-button>
    </div>
  </section>
  
  <!-- Input Section -->
  <section id="input-section" class="section">
    <h2>Input Components</h2>
    <div class="demo-group">
      <dx-text-box
        id="my-textbox"
        [(value)]="textInputValue"
        placeholder="Enter text here">
      </dx-text-box>
      
      <dx-text-box
        id="name-input-simple"
        [(value)]="nameInputValue"
        placeholder="Enter your name">
      </dx-text-box>
      
      <dx-text-box
        id="email-input-simple"
        [(value)]="emailInputValue"
        placeholder="Enter your email"
        type="email">
      </dx-text-box>
      
      <textarea
        id="my-textarea"
        [(ngModel)]="textareaValue"
        placeholder="Enter text in textarea"
        rows="5"
        style="width: 100%; padding: 8px; box-sizing: border-box;">
      </textarea>
    </div>
  </section>
  
  <!-- Generic Component Section (for core tests) -->
  <section id="core-section" class="section">
    <h2>Core Component Examples</h2>
    <div class="demo-group">
      <dx-text-box
        id="my-component"
        [(value)]="textInputValue"
        placeholder="Generic component for testing">
      </dx-text-box>
      
      <dx-text-box
        id="slow-component"
        [(value)]="textInputValue"
        placeholder="Slow loading component">
      </dx-text-box>
      
      <div id="async-component" class="async-container">
        <dx-data-grid
          [dataSource]="asyncGridData"
          [showBorders]="true">
          <dxi-column dataField="id" caption="ID"></dxi-column>
          <dxi-column dataField="name" caption="Name"></dxi-column>
        </dx-data-grid>
        <dx-button
          text="Load Data"
          (onClick)="loadAsyncData()"
          type="default">
        </dx-button>
      </div>
    </div>
  </section>
  
  <!-- Shadow DOM Section (for demonstration) -->
  <section id="shadow-section" class="section">
    <h2>Shadow DOM Component</h2>
    <div class="demo-group">
      <div id="shadow-host" class="shadow-host">
        <dx-button
          text="Shadow DOM Button"
          type="default">
        </dx-button>
      </div>
    </div>
  </section>
  
  <!-- Dropdown Section -->
  <section id="dropdown-section" class="section">
    <h2>Dropdown Component</h2>
    <div class="demo-group">
      <dx-select-box
        id="my-dropdown"
        [dataSource]="dropdownItems"
        displayExpr="name"
        valueExpr="id"
        [(value)]="selectedDropdownValue"
        placeholder="Select an option">
      </dx-select-box>
    </div>
  </section>
  
  <!-- DataGrid Section -->
  <section id="datagrid-section" class="section">
    <h2>DataGrid Component</h2>
    <div class="demo-group">
      <dx-data-grid
        id="my-datagrid"
        [dataSource]="gridData"
        [allowColumnReordering]="true"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        [showBorders]="true">
        <dxi-column dataField="id" caption="ID" [width]="80"></dxi-column>
        <dxi-column dataField="name" caption="Name"></dxi-column>
        <dxi-column dataField="email" caption="Email"></dxi-column>
        <dxi-column dataField="status" caption="Status"></dxi-column>
      </dx-data-grid>
    </div>
  </section>
  
  <!-- Popup Section -->
  <section id="popup-section" class="section">
    <h2>Popup Component</h2>
    <div class="demo-group">
      <dx-button
        id="open-popup-button"
        text="Open Popup"
        (onClick)="openPopup()"
        type="default">
      </dx-button>
      
      <dx-popup
        [visible]="popupVisible"
        [title]="popupTitle"
        [showTitle]="true"
        [width]="400"
        [height]="300"
        [dragEnabled]="true"
        (onHiding)="closePopup()">
        <div class="popup-content">
          <p>This is a sample popup content.</p>
          <dx-text-box
            placeholder="Enter value in popup">
          </dx-text-box>
          <dx-button
            text="Close"
            (onClick)="closePopup()"
            type="default">
          </dx-button>
        </div>
      </dx-popup>
    </div>
  </section>
  
  <!-- Validation Section -->
  <section id="validation-section" class="section">
    <h2>Validation Component</h2>
    <div class="demo-group">
      <div id="my-form" dx-validation-group #validationGroup (onInitialized)="onValidationGroupInit($event)">
        <dx-text-box
          id="name-input"
          [(value)]="validationNameValue"
          placeholder="Name (required)">
          <dx-validator>
            <dxi-validation-rule type="required" message="Name is required"></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
        
        <dx-text-box
          id="email-input"
          [(value)]="validationEmailValue"
          placeholder="Email (required, must be valid)">
          <dx-validator>
            <dxi-validation-rule type="required" message="Email is required"></dxi-validation-rule>
            <dxi-validation-rule type="email" message="Email is invalid"></dxi-validation-rule>
          </dx-validator>
        </dx-text-box>
      </div>
      <div class="form-actions">
        <dx-button
          id="submit-button"
          text="Submit"
          (onClick)="onSubmit()"
          type="success">
        </dx-button>
      </div>
    </div>
  </section>
</div>
